  const rows = sortRows('levels', M.L, LK, (a) => a.slice().sort((x, y) => (x.idle - y.idle) || ((x.daysLeft == null ? 99 : x.daysLeft) - (y.daysLeft == null ? 99 : y.daysLeft))));
  const T = (k, l, c) => sortTh('levels', k, l, c);
  let h = `<div class="tw"><table><thead><tr>${T('loc', 'Location')}${T('src', 'Source')}${T('pct', 'Bin level')}${T('lvl', 'Level (lb)', 'n')}${T('days', 'Days left', 'n')}${T('head', 'Head', 'n')}${T('rate', 'Eats / day', 'n')}${T('normal', 'Normal', 'n')}${T('last3', 'Last 3d', 'n')}${T('trend', '7-day')}${T('flags', 'Flags')}</tr></thead><tbody>`;
  for (const r of rows) {
    const c = r.cons;
    const lv = r.level;
    const lvTxt = lv ? (lv.measured ? fmt(lv.lbs) + (lv.rolled ? '<span class="muted small" title="Rolled forward from the last sensor reading"> ~</span>' : '') : `${fmt(lv.lbs)}–${fmt(lv.hi)}`) : '—';
    const lk = `l:${r.loc}`;
    h += `<tr class="expand${S.open[lk] ? ' open' : ''}" data-k="${lk}" title="Click to see the bins"${r.idle ? ' style="opacity:.55"' : ''}>
      <td><span class="car">▸</span><b>${esc(r.name)}</b> <span class="muted small">#${esc(r.loc)}</span>${r.idle ? ' ' + pill('mute', 'idle') : ''}</td>
      <td class="small">${esc(r.vendor ? VENDORS[r.vendor] : 'mill only')}${r.camera ? ' ' + pill('mute', 'camera', 'Infrared camera: consistent, but less exact than a load cell. Pounds can be off by about 10-20%.') : ''}${lv ? `<br><span class="muted">${lv.measured ? 'level ' + esc(ago(lv.asOf)) : 'level estimated'}</span>` : ''}</td>
      <td>${meter(r)}</td><td class="n">${lvTxt}</td>
      <td class="n">${r.daysLeft != null && !r.idle ? r.daysLeft.toFixed(1) : '—'}</td>
      <td class="n">${r.inv ? fmt(r.inv.headNow) + (r.inv.shared ? '<span class="muted small" title="One doForms record covers both Raak barns; split by FoxPro head count"> ~</span>' : '') + (r.inv.rec.Starting_Inventory ? `<br><span class="muted small">of ${fmt(r.inv.rec.Starting_Inventory * r.inv.share)} placed</span>` : '') : '<span class="muted">—</span>'}</td>
      <td class="n">${fmt(r.rate)}${r.inv && r.inv.headNow > 0 && r.rate > 0 ? `<br><b class="small" title="Eats / day divided by head in the barn now (doForms)">${(r.rate / r.inv.headNow).toFixed(2)} lb/head</b>` : ''}<br><span class="muted small">${esc(r.rateSrc || '')}</span>${r.inv && r.rateRaw && Math.abs(r.rate / r.rateRaw - 1) >= 0.02 ? `<br><span class="muted small" title="Rate before the head-count adjustment">was ${fmt(r.rateRaw)}</span>` : ''}</td>
      <td class="n">${c ? fmt(c.baseMean) : '—'}${r.inv && r.inv.phBase != null ? `<br><span class="muted small">${r.inv.phBase.toFixed(2)} lb/head</span>` : ''}</td><td class="n">${c ? fmt(c.recent3) : '—'}${r.inv && r.inv.ph3 != null ? `<br><span class="muted small">${r.inv.ph3.toFixed(2)} lb/head</span>` : ''}</td>
      <td>${c ? spark(c.spark, r.flags.some((f) => f.k === 'bad') ? 'var(--bad)' : 'var(--accent)') : ''}<br><a href="#" class="clink" data-loc="${esc(r.loc)}">Charts ›</a></td>
      <td>${flagsHtml(r)}</td></tr>
      <tr class="bindet"${S.open[lk] ? '' : ' hidden'}><td colspan="11">${binDetail(r, null)}</td></tr>`;
  }
  el.innerHTML = h + '</tbody></table></div>' +
    `<div class="note small muted">Click a row to see its individual bins. The graph shows the last 7 complete days of consumption; “Charts ›” opens larger charts for that barn. <b>Normal</b> = average lb/day over the 14 days before the last 3. <b>Eats / day</b> = average of the last 3 complete days from the bin scales, or mill deliveries ÷ 28 days where there is no scale feed. The <b>lb/head</b> line is that rate divided by the doForms head count (Normal and Last 3d show their own per-head figures). A level shown as a range is estimated: the low end assumes the bin was empty 28 days ago, the high end that it was full.</div>`;
  bindExpand(el); bindSort(el, 'levels');
  el.querySelectorAll('a.clink').forEach((a) => a.onclick = (e) => { e.preventDefault(); e.stopPropagation(); openChart(a.dataset.loc); });
}

/* ------------------------------------------------------------------ charts tab */
// Delivered = mill tickets by the day the batch finished. Used = the barn's daily consumption from the bin sensors.
// "Per bin" = barn total divided by the number of bins (vendors report consumption per barn, not per bin).
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const shortDay = (key) => MON[+key.slice(5, 7) - 1] + ' ' + (+key.slice(8, 10));
const CHART_DAYS = [14, 30, 60];
const CH = {};                              // chart id -> data kept for the hover layer

function binCount(r) {
  const per = r.level && r.level.bins ? r.level.bins.filter((b) => b.tandem || b.cap).length : 0;
  return per || SENSOR_BIN_COUNT[r.loc] || r.foxBins.length || r.binCaps.length || 1;
}
function chartSeries(r, N) {
  const end = addDays(M.todayKey, -1);                  // last complete day
  const byDay = {};
  for (const c of r.clusters) { const k = ctKey(c.stop); byDay[k] = (byDay[k] || 0) + c.lbs; }
  const c0 = r.cons;
  const out = [];
  for (let i = N - 1; i >= 0; i--) {
    const key = addDays(end, -i);
    let use = null;
    if (c0) { const off = Math.round((Date.parse(c0.lastComplete) - Date.parse(key)) / DAY); if (off >= 0) { const v = c0.at(off); use = v === undefined ? null : v; } }
    out.push({ key, del: byDay[key] || 0, use });
  }
  return out;
}
function chartStats(r, N) {
  const s = chartSeries(r, N), n = binCount(r);
  const uses = s.filter((x) => x.use != null).map((x) => x.use);
  const useAvg = uses.length ? mean(uses) : null;
  const delAvg = mean(s.map((x) => x.del));
  const perCap = r.cap && n ? r.cap / n : null;
  return { s, n, useAvg, delAvg, usePer: useAvg == null ? null : useAvg / n, delPer: delAvg / n, perCap, days: uses.length,
    fullBinDays: perCap && useAvg ? perCap / (useAvg / n) : null };
}
function niceScale(max) {
  if (!(max > 0)) return { max: 1, step: 0.25 };
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  return { max: Math.ceil(max / step - 1e-9) * step, step };
}
const kfmt = (v) => v >= 10000 ? Math.round(v / 1000) + 'k' : v >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(Math.round(v));
function barPath(x, y0, y, w) {             // rounded data end (top), flat on the baseline
  const h = y0 - y; if (h <= 0) return '';
  const r = Math.min(4, w / 2, h);
  return `M${x.toFixed(1)},${y0.toFixed(1)}V${(y + r).toFixed(1)}Q${x.toFixed(1)},${y.toFixed(1)} ${(x + r).toFixed(1)},${y.toFixed(1)}H${(x + w - r).toFixed(1)}Q${(x + w).toFixed(1)},${y.toFixed(1)} ${(x + w).toFixed(1)},${(y + r).toFixed(1)}V${y0.toFixed(1)}Z`;
}

// Bars = delivered, line = used (same unit, one axis). o: { id, div, ref:{v,label}, unit }
function dualChart(o, days) {
  const W = 960, H = o.H || 340, ml = 52, mr = 16, mt = 14, mb = 30, n = days.length, band = (W - ml - mr) / n;
  const vals = days.map((d) => d.del / o.div).concat(days.map((d) => (d.use == null ? 0 : d.use / o.div)), o.ref ? [o.ref.v] : []);
  const sc = niceScale(Math.max(...vals) * 1.04), y0 = H - mb;
  const X = (i) => ml + band * (i + 0.5), Y = (v) => mt + (y0 - mt) * (1 - v / sc.max);
  let g = '';
  for (let v = 0; v <= sc.max + 1e-9; v += sc.step) {
    g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/><text x="${ml - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" class="ax">${kfmt(v)}</text>`;
  }
  const step = Math.max(1, Math.ceil(n / 9));
  for (let i = 0; i < n; i++) if ((n - 1 - i) % step === 0) g += `<text x="${X(i).toFixed(1)}" y="${H - 9}" text-anchor="middle" class="ax">${shortDay(days[i].key)}</text>`;
  const bw = Math.max(3, Math.min(30, band * 0.62));
  days.forEach((d, i) => { if (d.del > 0) g += `<path d="${barPath(X(i) - bw / 2, y0, Y(d.del / o.div), bw)}" fill="var(--s1)"/>`; });
  const useVals = days.filter((d) => d.use != null);
  if (useVals.length) {
    let seg = [], segs = [];
    days.forEach((d, i) => { if (d.use == null) { if (seg.length) segs.push(seg); seg = []; } else seg.push(`${X(i).toFixed(1)},${Y(d.use / o.div).toFixed(1)}`); });
    if (seg.length) segs.push(seg);
    // 2px surface halo under the line keeps it readable where it crosses bars
    for (const s of segs) g += `<polyline points="${s.join(' ')}" fill="none" stroke="var(--surface)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="${s.join(' ')}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const avg = mean(useVals.map((d) => d.use / o.div));
    g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(avg).toFixed(1)}" y2="${Y(avg).toFixed(1)}" stroke="var(--s2)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".75"/>
      <text x="${W - mr - 4}" y="${(Y(avg) - 6).toFixed(1)}" text-anchor="end" class="lab" fill="var(--ink)">average used ${fmt(avg)} lb</text>`;
  }
  if (o.ref) g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(o.ref.v).toFixed(1)}" y2="${Y(o.ref.v).toFixed(1)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 4"/>
      <text x="${ml + 6}" y="${(Y(o.ref.v) - 6).toFixed(1)}" class="lab" fill="var(--muted)">${esc(o.ref.label)}</text>`;
  g += `<line id="${o.id}-x" y1="${mt}" y2="${y0}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/><circle id="${o.id}-d" r="5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  CH[o.id] = { days, o, W, ml, band, X, Y, y0, mt };
  return `<div class="chartbox" data-chart="${o.id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title)}">${g}</svg><div class="ctip" hidden></div></div>`;
}
function chartTable(days, div, unitNote) {
  return `<details class="ctable"><summary>View as table</summary><div class="tw"><table><thead><tr><th>Day</th><th class="n">Delivered ${unitNote}</th><th class="n">Used ${unitNote}</th></tr></thead><tbody>${days.slice().reverse().map((d) => `<tr><td>${esc(fmtDay(d.key))}</td><td class="n">${d.del ? fmt(d.del / div) : '—'}</td><td class="n">${d.use == null ? '—' : fmt(d.use / div)}</td></tr>`).join('')}</tbody></table></div></details>`;
}
const legendHtml = (a, b) => `<div class="legend"><span><i class="sw" style="background:var(--s1)"></i>${esc(a)}</span><span><i class="sw ln" style="background:var(--s2)"></i>${esc(b)}</span></div>`;

function barnOverview(rows, N) {
  const stats = rows.map((r) => ({ r, st: chartStats(r, N) })).filter((x) => x.st.usePer != null || x.st.delPer > 0)
    .sort((a, b) => (b.st.usePer || 0) - (a.st.usePer || 0));
  if (!stats.length) return '<div class="note">No barn data to chart yet.</div>';
  const W = 960, rowH = 46, ml = 262, mr = 90, top = 6, H = top + stats.length * rowH + 28;
  const max = Math.max(...stats.map((x) => Math.max(x.st.usePer || 0, x.st.delPer)));
  const sc = niceScale(max * 1.05), X = (v) => ml + (W - ml - mr) * v / sc.max;
  let g = '';
  for (let v = 0; v <= sc.max + 1e-9; v += sc.step) g += `<line x1="${X(v).toFixed(1)}" x2="${X(v).toFixed(1)}" y1="${top}" y2="${H - 24}" stroke="var(--grid)"/><text x="${X(v).toFixed(1)}" y="${H - 8}" text-anchor="middle" class="ax">${kfmt(v)}</text>`;
  stats.forEach((x, i) => {
    const y = top + i * rowH;
    g += `<g class="orow" data-loc="${esc(x.r.loc)}" tabindex="0"><rect x="0" y="${y}" width="${W}" height="${rowH}" fill="transparent"/>
      <text x="${ml - 12}" y="${y + 19}" text-anchor="end" class="rl" fill="var(--ink)">${esc(x.r.name)}</text>
      <text x="${ml - 12}" y="${y + 34}" text-anchor="end" class="ax">${x.st.n} bin${x.st.n === 1 ? '' : 's'}${x.r.camera ? ' · camera' : ''}</text>`;
    const bar = (v, yy, col, lab) => v == null ? '' : `<path d="M${ml},${yy}H${(X(v) - 4).toFixed(1)}Q${X(v).toFixed(1)},${yy} ${X(v).toFixed(1)},${yy + 4}V${yy + 8}Q${X(v).toFixed(1)},${yy + 12} ${(X(v) - 4).toFixed(1)},${yy + 12}H${ml}Z" fill="${col}"/><text x="${(X(v) + 6).toFixed(1)}" y="${yy + 10}" class="lab" fill="var(--ink)">${lab}</text>`;
    g += x.st.usePer != null ? bar(Math.max(x.st.usePer, 0.001), y + 8, 'var(--s2)', fmt(x.st.usePer)) : `<text x="${ml + 6}" y="${y + 18}" class="lab" fill="var(--muted)">no usage feed</text>`;
    g += bar(Math.max(x.st.delPer, 0.001), y + 24, 'var(--s1)', fmt(x.st.delPer));
    g += '</g>';
  });
  const tbl = `<details class="ctable"><summary>View as table</summary><div class="tw"><table><thead><tr><th>Barn</th><th class="n">Bins</th><th class="n">Used / bin / day</th><th class="n">Delivered / bin / day</th><th class="n">Barn used / day</th><th class="n">Barn delivered / day</th></tr></thead><tbody>${stats.map((x) => `<tr><td>${esc(x.r.name)}</td><td class="n">${x.st.n}</td><td class="n">${fmt(x.st.usePer)}</td><td class="n">${fmt(x.st.delPer)}</td><td class="n">${fmt(x.st.useAvg)}</td><td class="n">${fmt(x.st.delAvg)}</td></tr>`).join('')}</tbody></table></div></details>`;
  return `<div class="cardc"><h3>Average per bin per day, by barn <span class="muted small">last ${N} days · click a barn for its charts</span></h3>${legendHtml('Delivered per bin (mill tickets)', 'Used per bin (bin sensors)')}
    <div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Average pounds per bin per day by barn">${g}</svg></div>${tbl}</div>`;
}

// One chart card per barn. mode: 'combined' (whole barn), 'bins' (per bin) or 'both' (the two stacked, each on its own scale so the
// per-bin numbers are not flattened). Per bin = barn total / number of bins: the vendors report consumption for the barn, not per bin.
const CHART_MODES = [['combined', 'Combined'], ['bins', 'Individual bins'], ['both', 'Both']];
function barnChartCard(r, N, mode, compact) {
  const st = chartStats(r, N), s = st.s, id = 'c' + String(r.loc).replace(/[^a-z0-9]/gi, '');
  const cam = r.camera ? ' · infrared camera, pounds can be off by 10–20%' : '';
  const two = mode === 'both', H = compact ? (two ? 230 : 280) : (two ? 270 : 340);
  const ref = st.perCap ? { v: st.perCap, label: `one bin holds about ${fmt(st.perCap)} lb` } : null;
  const sub = `${st.useAvg == null ? 'no usage feed' : fmt(st.useAvg) + ' lb used/day'} · ${fmt(st.delAvg)} lb delivered/day · ${st.n} bin${st.n === 1 ? '' : 's'}${st.usePer != null ? ` (${fmt(st.usePer)} lb used per bin/day)` : ''}${cam}`;
  const panel = (kind) => kind === 'combined'
    ? `${two ? `<div class="panelh">Whole barn <span class="muted small">lb per day</span></div>` : ''}${dualChart({ id: id + '-b', H, div: 1, title: r.name + ' delivered and used per day' }, s)}`
    : `${two ? `<div class="panelh">Each bin <span class="muted small">barn total ÷ ${st.n} bin${st.n === 1 ? '' : 's'}, lb per bin per day</span></div>` : ''}${dualChart({ id: id + '-p', H, div: st.n, ref, title: r.name + ' delivered and used per bin per day' }, s)}`;
  const body = (mode === 'bins' ? panel('bins') : mode === 'both' ? panel('combined') + panel('bins') : panel('combined'));
  const tbl = `<details class="ctable"><summary>View as table</summary><div class="tw"><table><thead><tr><th>Day</th><th class="n">Delivered (barn)</th><th class="n">Used (barn)</th>${st.n > 1 ? '<th class="n">Delivered / bin</th><th class="n">Used / bin</th>' : ''}</tr></thead><tbody>${s.slice().reverse().map((d) => `<tr><td>${esc(fmtDay(d.key))}</td><td class="n">${d.del ? fmt(d.del) : '—'}</td><td class="n">${d.use == null ? '—' : fmt(d.use)}</td>${st.n > 1 ? `<td class="n">${d.del ? fmt(d.del / st.n) : '—'}</td><td class="n">${d.use == null ? '—' : fmt(d.use / st.n)}</td>` : ''}</tr>`).join('')}</tbody></table></div></details>`;
  const note = mode !== 'combined' && st.n > 1 ? `<div class="small muted" style="margin-top:6px">Each bin is shown as an equal share of the barn. The weight in each bin right now is on the Bin levels tab (click the barn's row).</div>` : '';
  return `<div class="cardc"><h3>${esc(r.name)} <span class="muted small">${esc(sub)}</span></h3>${legendHtml('Delivered (mill tickets, day the batch finished)', 'Used (daily consumption)')}${body}${tbl}${note}</div>`;
}
function barnCharts(r, N, mode) {
  const st = chartStats(r, N);
  const kp = (v, l, sub) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}${sub ? `<br><span class="muted">${sub}</span>` : ''}</div></div>`;
  const kpis = `<div class="kpis">${kp(st.useAvg == null ? '—' : fmt(st.useAvg), 'lb used per day', `last ${st.days} days with a scale reading`)}${kp(fmt(st.delAvg), 'lb delivered per day', 'mill tickets')}${kp(String(st.n), `bin${st.n === 1 ? '' : 's'}`, r.cap ? fmt(r.cap) + ' lb total' : '')}${kp(st.usePer == null ? '—' : fmt(st.usePer), 'lb used per bin per day')}${kp(fmt(st.delPer), 'lb delivered per bin per day')}${kp(st.fullBinDays ? st.fullBinDays.toFixed(1) + ' d' : '—', 'a full bin lasts', st.perCap ? 'bin ≈ ' + fmt(st.perCap) + ' lb' : '')}</div>`;
  return kpis + barnChartCard(r, N, mode, false);
}

function renderCharts() {
  const el = document.getElementById('p-charts');
  const rows = M.L.filter((r) => !r.idle && (r.cons || r.clusters.length)).sort((a, b) => a.name.localeCompare(b.name, 'en', { numeric: true }));
  if (!['all', 'each'].includes(S.chartLoc) && !rows.some((r) => r.loc === S.chartLoc)) S.chartLoc = 'each';
  const N = S.chartDays, mode = S.chartMode;
  const cmp = S.chartLoc === 'all';
  let h = `<div class="bar small"><label>Barn <select id="chartBarn"><option value="each"${S.chartLoc === 'each' ? ' selected' : ''}>Every barn (one chart each)</option><option value="all"${cmp ? ' selected' : ''}>Compare barns (averages)</option>${rows.map((r) => `<option value="${esc(r.loc)}"${r.loc === S.chartLoc ? ' selected' : ''}>${esc(r.name)}</option>`).join('')}</select></label>
    ${cmp ? '' : `<span class="seg" role="group" aria-label="Show">${CHART_MODES.map(([k, l]) => `<button class="chip${k === mode ? ' on' : ''}" data-cm="${k}">${l}</button>`).join('')}</span>`}
    ${CHART_DAYS.map((n) => `<button class="chip${n === N ? ' on' : ''}" data-cd="${n}">${n} days</button>`).join('')}</div>`;
  if (cmp) h += barnOverview(rows, N);
  else if (S.chartLoc === 'each') h += rows.map((r) => barnChartCard(r, N, mode, true)).join('') || '<div class="note">No barn data to chart yet.</div>';
  else h += barnCharts(rows.find((r) => r.loc === S.chartLoc), N, mode);
  h += `<div class="note small muted"><b>Delivered</b> is what the mill batched for the barn, counted on the day the batch finished (the truck may drop it a day or more later). <b>Used</b> is the barn's daily consumption from its bin sensors. Over a few weeks the two should be close; a persistent gap means feed is going somewhere else, or a sensor is off. <b>Individual bins</b> divides the barn total evenly across its bins, because the vendors report consumption for the whole barn. <b>Both</b> stacks the two, each on its own scale.</div>`;
  el.innerHTML = h;
  document.getElementById('chartBarn').onchange = (e) => { S.chartLoc = e.target.value; renderCharts(); };
  el.querySelectorAll('[data-cd]').forEach((b) => b.onclick = () => { S.chartDays = +b.dataset.cd; renderCharts(); });
  el.querySelectorAll('[data-cm]').forEach((b) => b.onclick = () => { S.chartMode = b.dataset.cm; renderCharts(); });
  el.querySelectorAll('.orow').forEach((g) => { const go = () => { S.chartLoc = g.dataset.loc; renderCharts(); window.scrollTo(0, 0); }; g.onclick = go; g.onkeydown = (e) => { if (e.key === 'Enter') go(); }; });
  el.querySelectorAll('.chartbox[data-chart]').forEach(bindChartHover);
}
function bindChartHover(box) {
  const c = CH[box.dataset.chart], svg = box.querySelector('svg'), tip = box.querySelector('.ctip');
  const xl = svg.querySelector(`#${c.o.id}-x`), dot = svg.querySelector(`#${c.o.id}-d`);
  const hide = () => { tip.hidden = true; xl.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
  svg.addEventListener('mouseleave', hide);
  svg.addEventListener('mousemove', (e) => {
    const rect = svg.getBoundingClientRect(), vx = (e.clientX - rect.left) * c.W / rect.width;
    const i = Math.max(0, Math.min(c.days.length - 1, Math.floor((vx - c.ml) / c.band)));
    const d = c.days[i], x = c.X(i);
    xl.setAttribute('x1', x); xl.setAttribute('x2', x); xl.setAttribute('visibility', 'visible');
    if (d.use != null) { dot.setAttribute('cx', x); dot.setAttribute('cy', c.Y(d.use / c.o.div)); dot.setAttribute('visibility', 'visible'); } else dot.setAttribute('visibility', 'hidden');
    const u = c.o.div > 1 ? ' lb / bin' : ' lb';
    tip.innerHTML = `<b>${esc(fmtDay(d.key))}</b><br><i class="sw" style="background:var(--s1)"></i>Delivered ${d.del ? fmt(d.del / c.o.div) + u : '—'}<br><i class="sw ln" style="background:var(--s2)"></i>Used ${d.use == null ? 'no reading' : fmt(d.use / c.o.div) + u}`;
    tip.hidden = false;
    const bx = box.getBoundingClientRect(), px = x / c.W * rect.width;
    tip.style.left = Math.min(Math.max(4, px + 12), bx.width - tip.offsetWidth - 4) + 'px';
    tip.style.top = '8px';
  });
}
function openChart(loc) {
  S.chartLoc = String(loc);
  showTab('charts');
  renderCharts();
  window.scrollTo(0, 0);
}

function renderRecon() {
  const el = document.getElementById('p-recon');
  const opts = [7, 14, 30, 60].map((n) => `<option value="${n}"${n === S.recon ? ' selected' : ''}>last ${n} days</option>`).join('');
  const rows = M.recon.rows.filter((x) => x.stop > NOW - S.recon * DAY);
  const bad = rows.filter((x) => x.sev === 'bad'), ok = rows.filter((x) => x.sev === 'ok');
  let h = `<div class="bar small"><select id="reconSel">${opts}</select>
    <span>${pill('ok', ok.length + ' matched')} ${pill('bad', bad.length + ' discrepancies')} ${pill('mute', (rows.length - ok.length - bad.length) + ' not checkable / pending')}</span>
    <label class="small"><input type="checkbox" id="reconBad"${S.onlyBad ? ' checked' : ''}> discrepancies only</label></div>`;
  const shown = S.onlyBad ? bad : rows;
  if (!shown.length) h += `<div class="note">Nothing to show.</div>`;
  else {
    const RK = { stop: (x) => x.stop, loc: (x) => x.name, tix: (x) => (x.tickets.length ? String(x.tickets[0]) : null), mill: (x) => x.mill || null, det: (x) => x.detected,
      diff: (x) => x.diff, res: (x) => (REC_RANK[x.sev] == null ? 9 : REC_RANK[x.sev]) };
    const T = (k, l, c) => sortTh('recon', k, l, c);
    h += `<div class="tw"><table><thead><tr>${T('stop', 'Batch finished')}${T('loc', 'Location')}${T('tix', 'Tickets')}${T('mill', 'Mill batched', 'n')}${T('det', 'Bin gained', 'n')}${T('diff', 'Difference', 'n')}${T('res', 'Result')}</tr></thead><tbody>`;
    for (const x of sortRows('recon', shown, RK)) {
      h += `<tr><td>${esc(fmtTime(x.stop))}</td><td><b>${esc(x.name)}</b> <span class="muted small">#${esc(x.loc)}</span></td>
        <td class="small">${x.tickets.length ? esc(x.tickets.join(', ')) : '—'}</td>
        <td class="n">${x.mill ? fmt(x.mill) : '—'}</td><td class="n">${x.detected == null ? '—' : fmt(x.detected)}</td>
        <td class="n">${x.diff == null ? '—' : (x.diff > 0 ? '+' : '') + fmt(x.diff)}</td>
        <td>${pill(x.sev, x.status)}${x.src ? ` <span class="muted small">${esc(x.src)}</span>` : ''}</td></tr>`;
    }
    h += '</tbody></table></div>';
  }
  h += `<div class="note small muted">A batch is matched to the bin fill(s) detected from the level sensor in the ${MATCH_AFTER_H} hours after it finishes (feed often reaches the bin the next day). Tickets for the same location less than ${CLUSTER_GAP_H} hours apart count as one truck trip. A difference over 10% (minimum 1,200 lb) is flagged. "No level feed" means that location has no sensor level data yet, so only the 28-day shipped-vs-eaten check applies.</div>`;
  el.innerHTML = h;
  bindSort(el, 'recon');
  document.getElementById('reconSel').onchange = (e) => { S.recon = +e.target.value; render(); };
  document.getElementById('reconBad').onchange = (e) => { S.onlyBad = e.target.checked; render(); };
}

function renderMis() {
  const el = document.getElementById('p-mis');
  const nm = (loc) => { const r = M.L.find((x) => x.loc === loc); return r ? r.name : 'Location ' + loc; };
  let h = '';
  M.mis.forEach((g, gi) => {
    const cross = g.rows.filter((x) => x.kind === 'cross'), own = g.rows.filter((x) => x.kind === 'own'), un = g.rows.filter((x) => x.kind === 'unexplained');
    const sits = own.map((x) => x.lag).sort((a, b) => a - b);
    h += `<div class="note"><b>${esc(g.group.name)}</b> — barns: ${g.group.locs.map((l) => esc(nm(l)) + ' #' + esc(l)).join(', ')}.<br>
      Sensor fills seen since ${esc(fmtTime(g.t0))}: <b>${g.rows.length}</b>.
      ${pill('ok', own.length + ' fit the barn\'s own ticket')} ${pill(cross.length ? 'bad' : 'ok', cross.length + ' fit only another barn\'s ticket')} ${un.length ? pill('warn', un.length + ' fit no ticket') : ''}<br>
      ${sits.length ? `<span class="small">Time from mixed to in the bin (own-barn matches): shortest ${esc(fmtSit(sits[0]))}, typical ${esc(fmtSit(sits[Math.floor(sits.length / 2)]))}, longest ${esc(fmtSit(sits[sits.length - 1]))}. The search window is ${g.group.maxSitH / 24} days because loaded feed can wait on the trailer.</span><br>` : ''}
      <span class="muted small">Barns with no bin sensor: ${g.group.locs.filter((l) => !g.sensed || !g.sensed.has(l)).map((l) => esc(nm(l)) + ' #' + esc(l)).join(', ') || 'none'} — feed delivered there can't be seen directly.</span></div>`;
    const T = (M.trailers && M.trailers[gi]) || [];
    if (T.length) {
      const stTxt = { arrived: ['ok', 'Delivered'], transit: ['info', 'On the way'], cross: ['bad', 'Reached another barn'], unknown: ['warn', 'Not seen in a bin'], pre: ['mute', 'Before sensor history'] };
      h += `<div class="tw"><table><thead><tr><th>Trailer mixed</th><th>Pair</th><th>Loads</th><th class="n">Pounds</th><th>Status</th></tr></thead><tbody>`;
      for (const t of T.slice(-10).reverse()) {
        h += `<tr><td>${esc(fmtTime(t.mixed))}</td><td><b>${esc(t.name)}</b>${t.repeat ? ' ' + pill('warn', 'repeat', 'Same pair as the trailer before it') : ''}</td>
          <td class="small">${t.loads.map((l) => `#${esc(l.c.tickets.map((x) => x.n).join(', #'))} ${esc(nm(l.loc))} ${fmt(l.c.lbs)} lb${l.state.k === 'arrived' ? ' → in bin ' + esc(fmtTime(l.state.t)) + (l.state.how === 'partner' ? ' (inferred)' : '') : l.state.k === 'cross' ? ' → filled ' + esc(nm(l.state.fill.loc)) + ' ' + esc(fmtTime(l.state.fill.t)) : ''}`).join('<br>')}</td>
          <td class="n">${fmt(t.lbs)}</td><td>${pill(stTxt[t.status][0], stTxt[t.status][1])}</td></tr>`;
      }
      h += '</tbody></table></div><div style="height:10px"></div>';
    }
    if (!g.rows.length) { h += `<div class="note">${esc(g.note || 'Nothing to compare yet.')}</div>`; return; }
    h += `<div class="tw"><table><thead><tr><th>Bin fill seen</th><th>Barn</th><th class="n">Gained</th><th>Best-matching mill ticket</th><th class="n">Ticket lb</th><th class="n">Sat before delivery</th><th>Verdict</th></tr></thead><tbody>`;
    for (const x of g.rows.slice().sort((a, b) => b.fill.t - a.fill.t)) {
      const f = x.fill, tr = x.trip;
      let verdict;
      if (x.kind === 'own') verdict = pill('ok', 'Own barn\'s ticket');
      else if (x.kind === 'cross') verdict = pill('bad', `Went to ${nm(f.loc)}, ticket was for ${nm(tr.loc)}`) +
        `<div class="small muted">${x.ownCandidates === 0 ? 'No ticket for this barn could have supplied it' : 'Own ticket was needed for another fill'}</div>`;
      else verdict = pill('warn', 'No ticket fits');
      h += `<tr><td>${esc(fmtTime(f.t))}</td><td><b>${esc(nm(f.loc))}</b> <span class="muted small">#${esc(f.loc)}</span><div class="small muted">${esc(f.bins.join(' + '))}</div></td><td class="n">${fmt(f.lbs)}</td>
        <td>${tr ? `#${esc(tr.c.tickets.map((t) => t.n).join(', #'))} for <b>${esc(nm(tr.loc))}</b><div class="small muted">finished ${esc(fmtTime(tr.c.stop))}</div>` : '—'}</td>
        <td class="n">${tr ? fmt(tr.c.lbs) : '—'}</td><td class="n">${x.lag != null ? esc(fmtSit(x.lag)) : '—'}</td><td>${verdict}</td></tr>`;
    }
    h += '</tbody></table></div>';
    if (g.unmatchedTrips && g.unmatchedTrips.length) {
      const wait = [], gone = [];
      for (const t of g.unmatchedTrips.sort((a, b) => a.c.stop - b.c.stop)) {
        const row = M.L.find((r) => r.loc === t.loc), onWay = row && row.tix && row.tix.transit.some((y) => y.c === t.c);
        (onWay ? wait : gone).push(`#${esc(t.c.tickets[0].n)} ${esc(nm(t.loc))} ${fmt(t.c.lbs)} lb (${esc(fmtTime(t.c.stop))})`);
      }
      if (wait.length) h += `<div class="note small"><b>Mixed, not yet seen in a bin (on the way, within ${g.group.maxSitH / 24} days):</b> ${wait.join('; ')}.</div>`;
      if (gone.length) h += `<div class="note small"><b>Tickets with no sensor fill seen:</b> ${gone.join('; ')}. These went into a barn without a sensor (Schaap South), or were delivered before sensor history began, or were not delivered.</div>`;
    }
  });
  h += `<div class="note small muted"><b>How to read this.</b> Mixed feed can sit loaded for several days before the driver takes it out, so each sensor-detected fill is paired with a mill ticket finished 0.4 hours to ${ROUTE_GROUPS[0].maxSitH / 24} days earlier with similar pounds. Pairings are chosen so that as many fills as possible land on their own barn's ticket; a fill is only called another barn's ticket when no own-barn ticket in that window can explain it. That makes the count a floor, and with a window this long it is also weak evidence: a fill that fits another barn's ticket may simply be an older own-barn load that waited. Real proof of who drove what needs the driver's load sheet or dispatch record, or a bin sensor on the barn with none (Schaap South).</div>`;
  el.innerHTML = h;
}

function renderNotes() {
  const el = document.getElementById('p-notes');
  const bm = D.binmaster || {}, ap = D.ap || {}, bt = D.barntools || {};
  const items = [];
  items.push(bm.levelByLocation ? `BinMaster: bin levels and delivery detection are live (${Object.keys(bm.levelByLocation).length} locations, ${Object.values(bm.deliveryEvents || {}).reduce((x, a) => x + a.length, 0)} fills stored${bm.eventsFrom ? ', watching since ' + fmtTime(Date.parse(bm.eventsFrom)) : ''}).`
    : 'BinMaster: sync update not deployed yet, so there are no bin levels or detected deliveries. Levels are estimated from tickets and scale consumption.');
  items.push(ap.levelByLocation ? `AP: daily bin levels are live for ${Object.keys(ap.levelByLocation).join(', ')}. Deliveries are inferred from day-over-day level change plus consumption.` : 'AP: level storage not deployed yet.');
  items.push(bt.levelByLocation && Object.keys(bt.levelByLocation).length ? `BarnTools: hourly bin levels are live for ${Object.keys(bt.levelByLocation).join(', ')} (${Object.values(bt.deliveryEvents || {}).reduce((x, a) => x + a.length, 0)} fills stored; each sync covers about 4 days).`
    : (bt.levelError ? 'BarnTools: level query failed: ' + bt.levelError : 'BarnTools: consumption only so far, so Schaap North and Raak levels are estimated.'));
  if (M && M.L) {
    const sc = M.L.filter((r) => r.btScale), nd = M.L.filter((r) => r.btCapDiff);
    if (sc.length) items.push('BarnTools pound correction: BarnTools bin sizes run larger than the real bins, so its pounds are scaled to the FoxPro capacity (levels, per-bin readings, fills and daily eating; stored data unchanged). ' + sc.map((r) => `${r.name} ×${r.btScale.f.toFixed(3)} (BarnTools ${fmt(r.btScale.raw)} lb → FoxPro ${fmt(r.btScale.fop)} lb)`).join('; ') + '.');
    if (nd.length) items.push('BarnTools pound correction skipped (sizes too different to be the same bins): ' + nd.map((r) => `${r.name} (BarnTools ${fmt(r.btCapDiff.raw)} vs FoxPro ${fmt(r.btCapDiff.fop)})`).join('; ') + '.');
  }
  {
    const n = bt.binMap ? Object.keys(bt.binMap).length : 0;
    const shown = Object.values(bt.levelByLocation || {}).reduce((x, L) => x + (L.bins || []).filter((b) => b.tandem).length, 0);
    const bd = bt.binDiscovery || {};
    if (!('binMap' in bt)) items.push('BarnTools individual bins: the updated barntools-sync.js has not run yet (the stored record has no binMap). Deploy it and wait for the next sync.');
    else if (n) items.push(`BarnTools individual bins: ${n} tandem pair${n === 1 ? '' : 's'} mapped (${[...new Set(Object.values(bt.binMapHow || {}))].join(', ') || 'manual'}); ${shown} bins shown separately.${bt.binChecks ? ' Checks: ' + Object.values(bt.binChecks).join('; ') + '.' : ''}${bt.binError ? ' Error: ' + bt.binError : ''}`);
    else {
      const t = bd.types || {}, bn = bd.barnType;
      items.push('BarnTools individual bins: none found yet. ' + [bt.binError && 'Error: ' + bt.binError, bd.error && 'Discovery: ' + bd.error, bd.at && 'Last tried ' + fmtTime(Date.parse(bd.at)),
        (bd.attempts || []).length && 'Tried: ' + bd.attempts.map((a) => a.path + (a.error ? ' failed (' + a.error + ')' : ' ' + a.barns + ' barns, ' + a.matched + ' ours')).join('; '),
        bn && Array.isArray(t[bn]) && bn + ' fields: ' + t[bn].join(', '),
        t.Bin && Array.isArray(t.Bin) && 'Bin fields: ' + t.Bin.join(', '),
        Object.keys(t).filter((k) => /tandem/i.test(k) && Array.isArray(t[k])).map((k) => k + ' fields: ' + t[k].join(', ')).join('. '),
        bd.feedSeriesFields && 'feedTimeSeries returns: ' + bd.feedSeriesFields.join(', '),
        bd.queryFields && !bd.path && 'Query fields: ' + bd.queryFields.join(', ')].filter(Boolean).join(' · '));
    }
  }
  items.push('BarnTools bins (Schaap North, Raak North, Raak South) use infrared cameras: consistent, but less exact than BinMaster\'s load cells. Fills there are matched to tickets with a ' + (TOL_CAMERA * 100) + '% tolerance instead of ' + (TOL_LOADCELL * 100) + '%, and their levels are marked as camera estimates.');
  {
    const iv = M.inv;
    if (!D.inventory) items.push('Head counts: the doForms inventory endpoint (api/inventory-data) is not deployed or not reachable, so feed forecasts do not account for sales yet.');
    else {
      items.push(`Head counts (doForms): ${Object.keys(iv.byLoc).length} barns matched to a doForms group. ${iv.events ? 'Sales are tracked since ' + fmtTime(iv.firstEvent) + ' (' + iv.events + ' recorded updates). Before that the head count is assumed constant.' : 'No history recorded yet; until the first inventory snapshot runs, the head count is assumed constant.'} Feed forecast = feed per pig per day (last 7 days) × pigs now. It does not predict future sales or pigs growing into higher intakes.`);
      if (iv.unmatchedGroups.length) items.push('No doForms record found for: ' + iv.unmatchedGroups.join(', ') + '. Those barns use the plain scale rate.');
      if (iv.noCount.length) items.push('doForms has no Current_Inventory number for: ' + iv.noCount.join(', ') + '.');
      if (iv.unmatchedRecs.length) items.push('doForms groups with no active FoxPro barn (ignored): ' + iv.unmatchedRecs.join(', ') + '.');
    }
  }
  items.push('Location 12 (Schaap South), the nurseries and any location without a bin scale have no vendor data; their rate comes from mill deliveries.');
  items.push('BinMaster and BarnTools sync every 15 minutes (GitHub Actions); AP syncs once a day. A level can be a little old (up to ~24 h for AP), so it is rolled forward using the eating rate and any mill tickets since. Mixed feed that has not yet been seen arriving in a bin is shown as "on the way" and counted as arriving (not as a delivery still to order). Schaap loads can wait up to ' + (ROUTE_GROUPS[0].maxSitH / 24) + ' days on the trailer. Barns without a sensor assume ' + ARRIVAL_LAG_H + ' h after mixing, unless their typical delay is longer.');
  items.push('Scale consumption is bucketed by UTC day (the existing sync convention), so a "day" runs 7 pm–7 pm Central.');
  items.push('Delivery detection is a threshold rule (a rise of at least ' + fmt(DELIVERY_MIN_LBS) + ' lb with small dips allowed). If it misses real fills or invents them, the two constants at the top of api/binmaster-sync.js can be tuned.');
  const san = (M.L || []).filter((r) => r.level && r.level.measured && r.cap && r.level.raw > r.cap * 1.25).map((r) => r.name);
  if (san.length) items.push('Check units: level exceeds capacity at ' + san.join(', ') + '.');
  el.innerHTML = '<div class="note"><ul style="margin:0;padding-left:18px">' + items.map((i) => `<li>${esc(i)}</li>`).join('') + '</ul></div>';
}

/* --------------------------------------------------------------------- UI */
function showTab(p) {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x.dataset.p === p));
  document.querySelectorAll('.panel').forEach((x) => x.classList.toggle('on', x.id === 'p-' + p));
}
function bindUI() {
  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('.tab'); if (!b) return;
    showTab(b.dataset.p);
  });
  const bind = (id, key) => document.getElementById(id).addEventListener('change', (e) => { const v = parseFloat(e.target.value); if (isFinite(v)) { S[key] = v; if (D) render(); } });
  bind('setReserve', 'reserveDays'); bind('setFill', 'fillPct'); bind('setDev', 'devPct');
  document.getElementById('reloadBtn').onclick = load;
}
async function init() { bindUI(); await load(); startAuto(); }
async function load() {
  document.getElementById('loading').style.display = 'block';
  NOW = Date.now();
  D = await loadAll();
  lastLoad = Date.now();
  render();
  showAuto();
}

// automatic refresh: re-read the data every few minutes while the page is open and visible
const AUTO_MS = 5 * 60 * 1000;
let lastLoad = Date.now(), autoBusy = false;
function showAuto(note) {
  const el = document.getElementById('autoNote');
  if (el) el.textContent = note || `Auto-refreshes every ${AUTO_MS / 60000} min · checked ${new Date(lastLoad).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
}
async function autoRefresh() {
  if (autoBusy || document.hidden) return;
  if (Date.now() - lastLoad < AUTO_MS - 5000) return;
  autoBusy = true;
  try {
    const nd = await loadAll();
    // keep what is on screen if the refresh came back empty (network blip)
    const ok = nd && nd.errors.length === 0 && (nd.bins || []).length;
    if (ok) { D = nd; NOW = Date.now(); lastLoad = Date.now(); render(); showAuto(); }
    else showAuto('Auto-refresh failed, showing the last good data · will retry');
  } catch (e) { showAuto('Auto-refresh failed, showing the last good data · will retry'); }
  autoBusy = false;
}
function startAuto() {
  setInterval(autoRefresh, 60 * 1000);                       // checks each minute, loads when 5 min have passed
  document.addEventListener('visibilitychange', () => { if (!document.hidden) autoRefresh(); });
}

window.FeedLogistics = { S, showTab, openChart, init, bindUI, load, render, buildModel, plan, rangeKeys, ctToEpoch, ctKey, addDays,
  _set(d, now) { D = d; if (now) NOW = now; }, _auto: autoRefresh, _age(ms) { lastLoad = Date.now() - ms; }, _model() { return M; } };
if (!window.__FL_NO_AUTO) init();
})();
</script>
